name: Feature request
description: An idea that would make Think First more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the feature. What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: part
    attributes:
      label: Which part does this touch?
      multiple: true
      options:
        - Browser extension
        - Mac app / hub
        - VS Code extension
        - Website
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
