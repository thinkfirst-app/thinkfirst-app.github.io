<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: normal; --paper:#FFFFFF; --ink:#1F2A37; --muted:#5B6573; --line:#CBD2DA; --field:#F6F8FA; --mark:#F2C94C; --markSoft:rgba(242,201,76,.35); --bad:#B42318; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#1B2430; --ink:#E8EDF2; --muted:#9AA6B2; --line:#3A4654; --field:#141B24; --mark:#E0B83C; --markSoft:rgba(224,184,60,.25); --bad:#F97066; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow-x: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  [hidden] { display: none !important; }

  .veil { position: fixed; inset: 0; background: rgba(20,28,40,.4); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: min(520px, 100%); background: var(--paper); border-radius: 14px; padding: 20px; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
  @media (prefers-reduced-motion: no-preference) { .card { animation: pop .14s ease-out; } @keyframes pop { from { transform: scale(.97); opacity: 0; } } }
  h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
  .sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .q { font-size: 13px; color: var(--muted); border-left: 3px solid var(--mark); padding: 2px 0 2px 10px; margin: 0 0 10px; max-height: 58px; overflow: hidden; }
  .usage { font-size: 13px; margin: 0 0 12px; }
  .usage b { background: var(--markSoft); padding: 1px 5px; border-radius: 4px; font-weight: 600; }
  textarea { width: 100%; min-height: 84px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--field); color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--markSoft); }
  .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); }
  button { font: inherit; font-size: 14px; border-radius: 9px; padding: 8px 14px; cursor: pointer; border: 1.5px solid var(--line); background: transparent; color: var(--ink); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }

  .panel { margin: 20px; background: var(--paper); border-radius: 14px; padding: 16px 18px; box-shadow: 0 6px 16px rgba(0,0,0,.2); border: 1px solid var(--line); border-top: 6px solid var(--mark); }
  .panel h3 { margin: 0 0 8px; font-size: 16px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
  .x { border: none; padding: 2px 6px; font-size: 18px; line-height: 1; color: var(--muted); }
  .note { font-size: 13px; background: var(--markSoft); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
  .guess { font-size: 15px; white-space: pre-wrap; margin: 0 0 10px; }
  .status { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .result { font-size: 14px; line-height: 1.5; }
  .result ul { margin: 4px 0 8px; padding-left: 18px; }
  .result strong { display: block; }
  .verdict { display: block; width: fit-content; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 99px; margin-bottom: 8px; background: var(--markSoft); }
  .err { color: var(--bad); }
  .small { font-size: 12px; padding: 5px 10px; }
</style>
</head>
<body>
  <div class="veil" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="title">
    <div class="card">
      <h2 id="title">What's your guess?</h2>
      <p class="sub">One line is plenty. It gets compared with the answer automatically.</p>
      <p class="q" id="question"></p>
      <p class="usage" id="usage"></p>
      <textarea id="guessBox" placeholder="I think it's probably… because…"></textarea>
      <div class="row">
        <span class="hint">Enter to send, Esc to skip</span>
        <span><button id="skip">Skip</button> <button class="primary" id="go">Send with guess</button></span>
      </div>
    </div>
  </div>

  <aside class="panel" id="panel" hidden aria-live="polite">
    <h3><span id="panelTitle">Your guess</span><button class="x" id="close" aria-label="Close">×</button></h3>
    <p class="note" id="note" hidden></p>
    <div id="guessArea" hidden>
      <p class="guess" id="guessText"></p>
      <p class="status" id="status"></p>
      <div class="result" id="result"></div>
      <button class="small" id="manual" hidden>Compare with highlighted text</button>
    </div>
  </aside>
  <script src="ai.js"></script>
  <script src="ui.js"></script>
</body>
</html>
