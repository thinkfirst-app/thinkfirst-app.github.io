<style>
:root{
  --bg:#fafaf9;--surface:#fff;--surface-2:#f7f7f6;--ink:#111214;--muted:#5f636b;
  --faint:#6b6e76;--faint-lg:#8b8e95;--deco:#a2a5ab;--faint-dark:#a2a5ab;
  --border:#e3e3e0;--border-soft:#ececea;
  --accent:#2E6FE4;--accent-hover:#2560cc;--accent-text:#2a64d2;
  --tint:#eaf0fd;--tint-2:#f3f6fd;--tint-border:#dfe8fb;--tint-active:#c9d8f7;
  --warn:#E4572E;--warn-text:#c9492a;--warn-bg:#fdf4f1;--warn-ink:#7a3a26;
  --dark-border:#3a3c41;--selection:#d5e2fb;--track:#f0f0ee;--empty:#f3f3f1;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:76px;-webkit-text-size-adjust:100%;background:var(--bg)}
@media (max-width:640px){html{scroll-padding-top:100px}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01"}
::selection{background:var(--selection)}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent-text)}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0;text-wrap:pretty}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip{position:absolute;left:16px;top:-120px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-weight:500;font-size:14px}
.skip:focus{top:12px;color:#fff;outline-color:#fff;outline-offset:-4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:24px;padding-right:24px}

/* Header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(250,250,249,.85);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border-soft)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.logo{display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
.logo:hover{color:var(--ink)}
.wordmark{font-size:17px;font-weight:600;letter-spacing:-.03em;line-height:1}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;flex-wrap:wrap;font-size:14px}
.nav a{color:var(--muted);padding:8px 0;display:inline-block}
.nav a:hover{color:var(--accent-text)}
@media (max-width:640px){.hdr-in{flex-wrap:wrap;padding-top:8px;padding-bottom:6px;row-gap:0}.nav{order:3;width:100%}.nav ul{gap:20px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:500;line-height:1.25;border:1px solid transparent;text-align:center;min-height:44px}
.btn-accent{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(17,18,20,.15)}
.btn-accent:hover{background:var(--accent-hover);color:#fff}
.btn-white{background:var(--surface);border-color:var(--border);color:var(--ink)}
.btn-white:hover{color:var(--accent-text);border-color:var(--tint-active)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{color:#fff;background:#2a2c31}
.btn-sm{padding:7px 14px;font-size:14px;border-radius:8px;min-height:36px}
.btn-light{background:#fff;color:var(--ink)}
.btn-light:hover{color:var(--ink);background:#eeeeec}
.btn-outline-dark{border-color:var(--dark-border);color:#fff}
.btn-outline-dark:hover{color:#fff;border-color:#7a7d84}

/* Hero */
.hero-wrap{position:relative;overflow:hidden}
.rings{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent 85%);mask-image:linear-gradient(to bottom,#000 40%,transparent 85%)}
.ring{position:absolute;border-radius:50%;animation:drift var(--dur) ease-in-out infinite}
.r1{width:760px;height:760px;left:calc(50% - 560px);top:-220px;border:1px solid rgba(46,111,228,.16);--dx:40px;--dy:20px;--dur:22s}
.r2{width:760px;height:760px;left:calc(50% - 200px);top:-220px;border:1px solid rgba(17,18,20,.08);--dx:-40px;--dy:16px;--dur:26s}
.r3{width:420px;height:420px;left:calc(50% - 380px);top:-60px;background:rgba(46,111,228,.05);--dx:30px;--dy:-20px;--dur:18s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--dx),var(--dy))}}
.hero{position:relative;padding-top:104px;padding-bottom:64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;flex-wrap:wrap;justify-content:center}
.pill:hover{color:var(--accent-text)}
.pill-new{background:var(--tint);color:var(--accent-text);border-radius:999px;padding:2px 8px;font-weight:500}
.pill-arrow{color:var(--deco)}
h1{font-size:clamp(52px,8vw,96px);letter-spacing:-.055em;line-height:.95;max-width:900px}
.h1-2{color:var(--faint-lg)}
.lead{font-size:19px;line-height:1.55;color:var(--muted);max-width:560px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.meta{font-size:13px;color:var(--faint)}

/* Demo */
.demo{position:relative;padding-top:16px;padding-bottom:96px}
.win{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(17,18,20,.04),0 30px 80px -40px rgba(17,18,20,.28);display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.win{grid-template-columns:280px minmax(0,1fr)}}
.side{background:var(--surface-2);border-bottom:1px solid var(--border-soft);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
@media (min-width:760px){.side{border-bottom:0;border-right:1px solid var(--border-soft)}}
.dots{display:flex;gap:6px;padding:0 6px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--border)}
.side-label{font-size:12px;font-weight:400;color:var(--faint);line-height:1.4}
.side-list{display:flex;flex-direction:column;gap:2px}
.side-list .side-label{padding:0 8px 6px}
.fields{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.fields li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:14px;color:var(--muted);line-height:1.4}
.fields li[aria-current]{background:var(--surface);color:var(--ink)}
.fname{display:inline-flex;gap:9px;align-items:center}
.fdot{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.fcount{font-family:var(--mono);font-size:12px;color:var(--faint)}
.side-foot{margin-top:auto;border-top:1px solid var(--border-soft);padding:14px 8px 0;display:flex;flex-direction:column;gap:4px}
.side-big{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.dmain{padding:28px 32px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:480px){.dmain{padding:22px 18px 24px}}
.steps{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--faint);list-style:none;margin:0;padding:0;line-height:1.4}
.steps li{color:var(--faint)}
.steps li+li::before{content:"—";margin-right:6px;color:var(--faint);font-weight:400}
.steps li.is-done{color:var(--muted)}
.steps li[aria-current]{color:var(--ink);font-weight:600}
.ask{display:flex;flex-direction:column;gap:12px}
.q{font-size:24px;font-weight:500;letter-spacing:-.02em;border:0;padding:2px 0;background:transparent;color:var(--ink);width:100%;min-width:0;border-radius:4px;line-height:1.3}
.q::placeholder,.gtext::placeholder{color:var(--faint);opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;border:1px solid var(--border-soft);background:var(--bg);border-radius:8px;padding:5px 10px;color:var(--muted);min-height:28px;line-height:1.3}
.chip:hover{border-color:var(--tint-active);color:var(--accent-text)}
.gbox{border:1px solid var(--border-soft);border-radius:12px;background:var(--bg);overflow:hidden;transition:border-color .15s}
.gbox.is-valid{border-color:var(--tint-active)}
.gtext{display:block;width:100%;font-size:15px;line-height:1.55;border:0;padding:14px 16px;resize:none;background:transparent;color:var(--ink)}
.gtext:focus-visible{outline-offset:-2px;border-radius:12px 12px 0 0}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-top:1px solid var(--border-soft);background:var(--surface);flex-wrap:wrap}
.hint{font-size:13px;color:var(--faint);line-height:1.4}
.hint.is-ok{color:var(--accent-text)}
.reveal{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:500;min-height:36px;line-height:1.3}
.reveal[aria-disabled="true"]{background:var(--track);color:var(--faint);cursor:not-allowed}
.demo-note{font-size:13px;color:var(--faint)}
.result{display:flex;flex-direction:column;gap:14px;border-radius:12px}
.result:not([hidden]){animation:fadein .35s ease-out}
.result:focus{outline:none}
.result:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:12px;background:var(--tint-2);border:1px solid var(--tint-border)}
.answer-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.answer-label{font-size:13px;font-weight:500;color:var(--accent-text)}
.tag{font-size:12px;color:var(--muted);font-family:var(--mono)}
.answer-body{font-size:15px;line-height:1.6}
.rate-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rate{border:0;margin:0;padding:0;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate label{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:30px;display:inline-flex;align-items:center;line-height:1.3}
.rate input:checked+label{background:var(--ink);color:#fff;border-color:var(--ink)}
.rate input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.rate label:hover{border-color:var(--tint-active);color:var(--accent-text)}
.rate input:checked+label:hover{color:#fff}
.newq{margin-left:auto;background:none;border:0;color:var(--accent-text);font-size:14px;font-weight:500;padding:6px 4px;border-radius:6px}
.newq:hover{color:var(--accent-hover)}

/* Ticker */
.ticker{position:relative;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);background:var(--surface);overflow:hidden;padding:14px 0}
.ticker::after{content:"";position:absolute;right:0;top:0;bottom:0;width:88px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 55%);pointer-events:none}
.track{display:flex;width:max-content;white-space:nowrap;animation:marquee 70s linear infinite}
.ticker:hover .track,.ticker:focus-within .track,.ticker.is-paused .track{animation-play-state:paused}
.track ul{display:flex;list-style:none;margin:0;padding:0}
.track li{display:inline-flex;gap:10px;align-items:center;padding:0 20px;font-size:13px;color:var(--muted);line-height:1.5}
.tq{color:var(--ink)}
.ttag{border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:12px}
.tr{font-size:12px;color:var(--faint)}
.tr.is-hit{color:var(--accent-text)}
.tr.is-miss{color:var(--warn-text)}
.tsep{width:4px;height:4px;border-radius:50%;background:#d5d5d2;margin-left:20px}
@keyframes marquee{to{transform:translateX(-50%)}}
.ticker-btn{position:absolute;z-index:2;right:16px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);box-shadow:0 1px 2px rgba(17,18,20,.08);padding:0}
.ticker-btn:hover{color:var(--accent-text);border-color:var(--tint-active)}
.ticker-btn svg{width:12px;height:12px;fill:currentColor}
.ticker-btn .i-play{display:none}
.ticker.is-paused .i-pause{display:none}
.ticker.is-paused .i-play{display:block}
@media (prefers-reduced-motion:reduce){
  .track{animation:none;width:auto;white-space:normal}
  .track ul{flex-wrap:wrap;row-gap:10px;justify-content:center;padding:0 24px}
  .track ul[aria-hidden]{display:none}
  .track li{padding:0 10px}
  .tsep{display:none}
  .ticker-btn,.ticker::after{display:none}
}

/* Sections */
.sec{padding-top:128px;padding-bottom:128px}
.band{background:var(--surface);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
h2{font-size:clamp(36px,4.6vw,52px);letter-spacing:-.045em;line-height:1.02}
.h2-sm{font-size:clamp(32px,4vw,44px);line-height:1.05}
.sub{font-size:17px;line-height:1.6;color:var(--muted)}
.sec-head{display:flex;flex-direction:column;gap:18px;max-width:720px;margin-bottom:56px}
.sec-head strong{color:var(--ink);font-weight:500}

/* Why */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:64px;align-items:start}
.why-l{display:flex;flex-direction:column;gap:18px}
.why-l .sub{max-width:420px}
@media (min-width:880px){.why-l{position:sticky;top:110px}}
.whys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.whys li{display:grid;grid-template-columns:36px 1fr;gap:16px;padding:26px 0;border-top:1px solid var(--border)}
.whys .num{font-family:var(--mono);font-size:13px;color:var(--faint);padding-top:4px}
.whys .body{display:flex;flex-direction:column;gap:8px}
.whys h3{font-size:19px;letter-spacing:-.02em;line-height:1.3}
.whys p{font-size:16px;line-height:1.65;color:var(--muted)}

/* Tracking matrix */
.mframe{position:relative;border:1px solid var(--border);border-radius:16px;padding:28px;background:var(--bg);overflow-x:auto}
.mframe:focus-visible{outline-offset:3px}
.matrix{display:block;min-width:680px;border-collapse:collapse;border-spacing:0}
.matrix thead,.matrix tbody{display:block}
.matrix tbody{display:flex;flex-direction:column;gap:5px}
.matrix tr{display:grid;grid-template-columns:130px repeat(6,minmax(0,1fr)) 56px;gap:5px;align-items:center}
.matrix thead tr{font-size:12px;color:var(--faint);padding-bottom:8px;margin-bottom:5px}
.matrix th,.matrix td{padding:0;font-weight:400}
.matrix thead th{text-align:center}
.matrix thead th:last-child{text-align:right}
.matrix tbody th{font-size:14px;font-weight:500;text-align:left;color:var(--ink)}
.cell{min-height:32px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--cbg,var(--empty));color:var(--cfg,var(--ink))}
.total{font-family:var(--mono);font-size:13px;text-align:right}
.mfoot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--faint)}
.legend{display:inline-flex;gap:8px;align-items:center}
.lbar{display:inline-block;width:80px;height:6px;border-radius:3px;background:linear-gradient(90deg,#eeeeec,#2E6FE4)}

/* How it works, audiences, install */
.sec h2.lone{margin-bottom:56px;max-width:640px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px}
.card .num{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--muted)}
.card h3{font-size:18px;letter-spacing:-.02em;margin-top:8px;line-height:1.3}
.card p{line-height:1.6;color:var(--muted);font-size:15px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;list-style:none;margin:0;padding:0}
.who-card{background:var(--bg);border:1px solid var(--border-soft);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:10px}
.who-card .lbl{font-size:13px;color:var(--accent-text);font-weight:500}
.who-card h3{font-size:20px;letter-spacing:-.025em;line-height:1.25}
.who-card p{font-size:15px;line-height:1.6;color:var(--muted)}

/* Accuracy breakdown */
.bd{padding-top:0;padding-bottom:128px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:center}
.bd-l{display:flex;flex-direction:column;gap:18px}
.bd-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px -40px rgba(17,18,20,.25)}
.bd-head{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);gap:12px}
.bd-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.bd-row{display:grid;grid-template-columns:88px 1fr 44px;gap:14px;align-items:center;font-size:14px}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:3px}
.bd-row.is-low .bar i{background:var(--warn)}
.pct{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
.bd-row.is-low .pct{color:var(--warn-text)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--warn-ink)}
.alert i{width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}

/* FAQ */
.faq{max-width:760px}
.faq h2{margin-bottom:32px}
.faq details{border-top:1px solid var(--border)}
.faq summary{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:20px 0;cursor:pointer;list-style:none;color:var(--ink);border-radius:6px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::marker{content:""}
.faq summary h3{font-size:17px;font-weight:500;letter-spacing:-.01em;line-height:1.4;text-wrap:pretty}
.faq summary:hover{color:var(--accent-text)}
.faq .icon{color:var(--faint);font-size:20px;font-weight:400;line-height:1;flex:none;width:20px;text-align:center}
.faq .icon::before{content:"+"}
.faq details[open] .icon::before{content:"−"}
.faq .ans{margin:0 0 22px;line-height:1.65;color:var(--muted);max-width:640px;font-size:16px}

/* Final CTA + install */
.get{padding-bottom:96px}
.cta{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:20px;padding:88px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.cta>*{position:relative}
.cta-rings{position:absolute!important;inset:0;pointer-events:none}
.c1{width:520px;height:520px;left:calc(50% - 420px);top:-160px;border:1px solid rgba(46,111,228,.35);--dx:30px;--dy:20px;--dur:20s}
.c2{width:520px;height:520px;left:calc(50% - 100px);top:-160px;border:1px solid rgba(255,255,255,.08);--dx:-30px;--dy:10px;--dur:24s}
.cta h2{font-size:clamp(40px,5.5vw,64px);letter-spacing:-.05em;line-height:1}
.cta .sub{color:var(--faint-dark);max-width:440px;line-height:1.55}
.cta a:focus-visible{outline-color:#fff}
@media (max-width:480px){.cta{padding:64px 24px}}
.install{margin-top:16px}
.install .card h3{margin-top:0}
.install .opt{font-size:13px;color:var(--faint);margin-top:-8px}
.install ol{margin:4px 0 8px;padding-left:20px;color:var(--muted);font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.install .btn{align-self:flex-start;margin-top:auto}
.install code{font-family:var(--mono);font-size:13px;background:var(--track);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* Footer */
.foot{padding-bottom:40px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--faint)}
.foot .logo{gap:8px}
.foot .wordmark{font-size:14px}
.foot .copy{margin-left:8px;color:var(--faint)}
.foot ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.foot a{color:var(--faint);padding:8px 0;display:inline-block}
.foot a:hover{color:var(--accent-text)}

/* Privacy page */
.doc{max-width:720px;padding-top:64px;padding-bottom:96px;display:flex;flex-direction:column;gap:20px}
.doc h1{font-size:clamp(36px,5vw,52px);letter-spacing:-.045em;line-height:1.05}
.doc h2{font-size:24px;letter-spacing:-.025em;line-height:1.25;margin-top:20px}
.doc p,.doc li{font-size:16px;line-height:1.65;color:var(--muted)}
.doc ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.doc b{color:var(--ink);font-weight:500}
.doc a{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.doc a.btn{color:#fff;text-decoration:none}
.doc code{font-family:var(--mono);font-size:14px;background:var(--track);padding:1px 5px;border-radius:4px;color:var(--ink)}
.doc .date{font-size:13px;color:var(--faint)}
.back{font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:6px 0}
.page-404{min-height:100vh;display:flex;flex-direction:column}
.page-404 main{flex:1}
.doc-404{justify-content:center;max-width:1120px;padding-top:96px}
.doc-404 p{font-size:19px;max-width:520px}

/* Motion, contrast and forced-colors preferences */
@media (prefers-reduced-motion:reduce){
  .ring{animation:none}
  .result:not([hidden]){animation:none}
  .gbox{transition:none}
}
@media (prefers-contrast:more){
  :root{--border:#8b8e95;--border-soft:#a2a5ab;--faint:#4e5158;--faint-lg:#5f636b}
  .q{border-bottom:1px solid var(--border);border-radius:0}
  .hdr{background:var(--bg)}
}
@media (forced-colors:active){
  .btn,.chip,.reveal,.rate label,.ticker-btn,.newq{border:1px solid ButtonText}
  .reveal[aria-disabled="true"]{color:GrayText;border-color:GrayText}
  .fields li[aria-current]{outline:2px solid Highlight;outline-offset:-2px}
  .rate input:checked+label{outline:3px solid Highlight;outline-offset:-3px}
  .cell,.bar,.gbox,.answer{border:1px solid CanvasText}
  .bar i,.fdot,.alert i,.lbar,.tsep{background:CanvasText;forced-color-adjust:none}
  .rings,.cta-rings{display:none}
}
